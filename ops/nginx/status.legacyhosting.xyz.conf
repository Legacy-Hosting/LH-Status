limit_req_zone $binary_remote_addr zone=legacy_status:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name status.legacyhosting.xyz;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.legacyhosting.xyz;

    ssl_certificate /etc/letsencrypt/live/status.legacyhosting.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.legacyhosting.xyz/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/lh-status.access.log;
    error_log /var/log/nginx/lh-status.error.log;
    root /var/www/legacy-hosting-status;
    index index.html;
    client_max_body_size 64k;
    limit_req zone=legacy_status burst=60 nodelay;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/letsencrypt;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /api/v1/status {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /status-fallback.json;
    }

    location ^~ /api/v1/history/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /feed.atom {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ^~ /api/v1/subscriptions/push {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
    }

    location = /status-fallback.json {
        internal;
        alias /var/lib/legacy-hosting-status/status-snapshot.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=10, stale-if-error=300" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
