name: Status CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check operations scripts
        run: |
          bash -n ops/scripts/*.sh tests/release-rollback-integration.sh
          shellcheck --severity=error ops/scripts/*.sh tests/release-rollback-integration.sh
      - name: Exercise transactional release rollback
        run: docker run --rm --read-only --tmpfs /opt:rw,exec,nosuid,nodev --tmpfs /var:rw,nosuid,nodev --tmpfs /tmp:rw,exec,nosuid,nodev --env LH_ROLLBACK_TEST_CONTAINER=1 --volume "$PWD:/repo:ro" --workdir /repo ubuntu:26.04 bash tests/release-rollback-integration.sh
      - run: pnpm test
      - run: pnpm typecheck && pnpm build
      - run: pnpm audit --prod --audit-level high
